# Railway configuration for the API + Worker

[build]
builder = "nixpacks"
buildCommand = "pnpm install && pnpm run build --filter=@agentguard/api"

[deploy]
startCommand = "pnpm --filter @agentguard/api start"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environments.production.variables]
NODE_ENV = "production"
PORT = "3001"
