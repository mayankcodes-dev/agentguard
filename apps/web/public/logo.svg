<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#22c55e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Shield body -->
  <path d="M100 18 L162 42 L162 90 C162 130 134 160 100 174 C66 160 38 130 38 90 L38 42 Z"
    fill="url(#shieldGrad)" filter="url(#shadow)"/>

  <!-- Shield inner highlight -->
  <path d="M100 26 L154 47 L154 90 C154 126 129 153 100 166 C71 153 46 126 46 90 L46 47 Z"
    fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- AG letters -->
  <text x="100" y="108" text-anchor="middle"
    font-family="'Arial Black', 'Arial', sans-serif"
    font-size="46" font-weight="900" letter-spacing="-2"
    fill="#0a0a0a" filter="url(#glow)">AG</text>

  <!-- Wordmark -->
  <text x="100" y="148" text-anchor="middle"
    font-family="'Arial', sans-serif"
    font-size="11" font-weight="600" letter-spacing="3"
    fill="#1e293b" text-transform="uppercase">AGENTGUARD</text>
</svg>
